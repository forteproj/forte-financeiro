<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forte Sinalização — Sistema Financeiro</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
:root{
  --ds-font:'Montserrat',sans-serif;--ds-mono:'Montserrat',sans-serif;
  --ds-or:#F5A623;--ds-ord:#D4841A;--ds-or-light:#FFF3DC;
  --ds-dark:#1E1C18;--ds-dark2:#252320;--ds-dark3:#2C2A26;--ds-dark4:#383530;--ds-dark5:#4A4845;
  --ds-bg:#F4F4F0;--ds-bg2:#ECEAE4;--ds-bg3:#E2DFD8;--ds-bg4:#D8D5CE;--ds-wh:#FFFFFF;
  --ds-bd:#E2E0D8;--ds-bd2:#C8C5BE;--ds-bd3:#AEA9A0;
  --ds-tx:#1A1916;--ds-tx2:#5A5852;--ds-tx3:#908D86;--ds-fv:#ECEAE4;
  --ds-grn:#2D7D46;--ds-grn-l:#E6F4EB;--ds-grn-bg:rgba(45,125,70,0.12);--ds-grn-bd:rgba(45,125,70,0.3);
  --ds-red:#C0392B;--ds-red-l:#FDECEA;--ds-red-bg:rgba(192,57,43,0.12);--ds-red-bd:rgba(192,57,43,0.3);
  --ds-blu:#2E6DA4;--ds-blu-l:#E8F2FB;--ds-blu-bg:rgba(46,109,164,0.12);--ds-blu-bd:rgba(46,109,164,0.3);
  --ds-ylw:#B8860B;--ds-ylw-l:#FEF3DC;--ds-ylw-bg:rgba(184,134,11,0.12);--ds-ylw-bd:rgba(184,134,11,0.3);
  --ds-roxo:#6B46C1;--ds-roxo-l:#EDE9FE;
  --ds-r:10px;--ds-r-sm:6px;--ds-r-lg:14px;
  --ds-sh:0 2px 8px rgba(0,0,0,.08);--ds-sh2:0 4px 16px rgba(0,0,0,.1);--ds-sh3:0 20px 60px rgba(0,0,0,.25);
}
  </style>
  <link rel="stylesheet" href="src/styles/variables.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/pages/login.css">
  <link rel="stylesheet" href="src/styles/pages/plano-contas.css">
  <link rel="stylesheet" href="src/styles/pages/contratos.css">
  <link rel="stylesheet" href="src/styles/pages/lancamentos.css">
</head>
<body>

<!-- TOPBAR (oculto até login) -->
<div class="topbar" id="topbar" style="display:none">
  <span class="topbar-logo">FORTE</span>
  <span class="topbar-sep">/</span>
  <span class="topbar-sub">Sistema Financeiro</span>
  <nav class="topbar-nav" id="topbar-nav"></nav>
  <div class="topbar-right">
    <span class="user-badge" id="topbar-user">—</span>
    <button class="btn-tb" id="btn-topbar-admin" style="display:none"
      data-route="usuarios">Usuários</button>
    <button class="btn-tb" id="btn-topbar-sair">Sair</button>
  </div>
</div>

<!-- CONTEÚDO DA PÁGINA ATIVA -->
<main id="app"></main>

<!-- TELA DE CARREGAMENTO INICIAL -->
<div id="loading-screen">
  <div class="loading-inner">
    <div class="loading-logo">FORTE</div>
    <div class="loading-bar"></div>
  </div>
</div>

<script type="module" src="src/js/app.js"></script>
</body>
</html>
